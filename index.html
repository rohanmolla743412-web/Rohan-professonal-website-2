<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body>
<main class="app"><section class="card">
<p class="eyebrow">ROHAN • PROJECT 01</p><h1>My To-Do App</h1>

</section><footer>Built by <b>ROHAN</b></footer></main>
